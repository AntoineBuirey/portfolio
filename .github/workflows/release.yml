name: Build and deploy release

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  NODE_VERSION: 22.12.0

jobs:
  build:
    name: Build application
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set application version from release tag
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${RELEASE_TAG#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag '$RELEASE_TAG' is not a supported semantic version." >&2
            exit 1
          fi

          npm version "$version" --no-git-tag-version
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Archive compiled files
        run: tar -czf "portfolio-dist-${{ steps.version.outputs.value }}.tar.gz" -C dist .

      - name: Upload build for deployment
        uses: actions/upload-artifact@v4
        with:
          name: compiled-site
          path: |
            dist/
            portfolio-dist-${{ steps.version.outputs.value }}.tar.gz
          if-no-files-found: error

  deploy:
    name: Deploy application
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
    env:
      VERSION: ${{ needs.build.outputs.version }}
      SERVER_PORT: ${{ secrets.SERVER_PORT || 22 }}

    steps:
      - name: Download compiled files
        uses: actions/download-artifact@v4
        with:
          name: compiled-site
          path: build

      - name: Configure SSH
        shell: bash
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "${{ secrets.SERVER_SSH_KEY }}" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "${{ secrets.SERVER_KNOWN_HOSTS }}" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Deploy dist to server
        shell: bash
        run: |
          rsync -az --delete \
            -e "ssh -i $HOME/.ssh/deploy_key -p $SERVER_PORT" \
            build/dist/ \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.SERVER_PATH }}/"

      - name: Write Google site verification file
        shell: bash
        env:
          VERIFICATION_FILENAME: ${{ secrets.GOOGLE_VERIFICATION_FILENAME }}
          VERIFICATION_CONTENT: ${{ secrets.GOOGLE_VERIFICATION_CONTENT }}
          SERVER_PATH: ${{ secrets.SERVER_PATH }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          if [[ -z "$VERIFICATION_FILENAME" || -z "$VERIFICATION_CONTENT" ]]; then
            echo "Google verification secrets are not configured; skipping verification file."
            exit 0
          fi

          if [[ ! "$VERIFICATION_FILENAME" =~ ^[A-Za-z0-9._=-]+$ ]]; then
            echo "GOOGLE_VERIFICATION_FILENAME must be a simple file name at the server root." >&2
            exit 1
          fi

          remote_path="${SERVER_PATH%/}/$VERIFICATION_FILENAME"
          printf '%s\n' "$VERIFICATION_CONTENT" | ssh \
            -i "$HOME/.ssh/deploy_key" \
            -p "$SERVER_PORT" \
            "$SERVER_USER@$SERVER_HOST" \
            "cat > \"$remote_path\""

      - name: Attach compiled files to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: build/portfolio-dist-${{ env.VERSION }}.tar.gz
          fail_on_unmatched_files: true
